<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock & Invoice System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#16222e;--mut:#5d6b79;--line:#d9dfe5;--bg:#eef1f4;--card:#fff;--nav:#17314a;--navt:#c9d6e2;--acc:#0b6e8a;--accd:#08556b;--ok:#18794e;--bad:#b42318;--warn:#a15c07}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:5px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--accd)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:#f3f5f7}
.btn.bad{background:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{background:var(--card);width:340px;max-width:100%;padding:28px;border-radius:8px;border:1px solid var(--line)}
.lbox h1{font-size:20px;margin-bottom:4px}
.lbox p{color:var(--mut);margin:0 0 18px}
.lbox .f{margin-bottom:12px}
#app{display:none;min-height:100vh}
#side{width:210px;background:var(--nav);color:var(--navt);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column}
#side .brand{padding:16px;color:#fff;font-weight:700;font-size:15px;border-bottom:1px solid #284a68}
#side .brand small{display:block;font-weight:400;color:var(--navt);font-size:12px}
#side nav{flex:1;padding:8px 0;overflow:auto}
#side a{display:block;padding:10px 16px;color:var(--navt);text-decoration:none;cursor:pointer;border-left:3px solid transparent}
#side a:hover{background:#1f3f5e}
#side a.on{background:#1f3f5e;color:#fff;border-left-color:#5cc8e6}
#side .me{padding:12px 16px;border-top:1px solid #284a68;font-size:12.5px}
#main{margin-left:210px;padding:20px;max-width:1250px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.top h2{font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f4f6f8;font-size:12.5px;color:var(--mut);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:7px}
.tw table{border:0}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.tag.ok{background:#dcf3e7;color:var(--ok)}.tag.bad{background:#fde4e1;color:var(--bad)}.tag.warn{background:#fdf0d5;color:var(--warn)}
.stat{background:#fff;border:1px solid var(--line);border-radius:7px;padding:12px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mut);font-size:12.5px}
.mut{color:var(--mut)}
.line{border:1px solid var(--line);border-radius:7px;padding:12px;margin-bottom:10px;background:#fbfcfd}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.bar>div{flex:1;min-width:130px}
#modalBg{display:none;position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:20;overflow:auto;padding:30px 12px}
.modal{background:#fff;max-width:560px;margin:0 auto;border-radius:8px;padding:18px}
.modal h3{margin-bottom:12px}
.modal .row{margin-bottom:10px}
#toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;display:none;z-index:30;max-width:340px}
#toast.err{background:var(--bad)}
.tot{max-width:320px;margin-left:auto}
.tot div{display:flex;justify-content:space-between;padding:4px 0}
.tot .g{font-size:18px;font-weight:700;border-top:2px solid var(--ink);margin-top:4px;padding-top:6px}
.pw{position:relative}.pw input{padding-right:40px}
.eye{position:absolute;right:2px;top:2px;bottom:2px;width:34px;border:0;background:transparent;font-size:16px;opacity:.5;padding:0}
.eye.on{opacity:1}
.tabs{display:flex;gap:4px;margin:12px 0 16px;border-bottom:1px solid var(--line)}
.tabs a{padding:8px 12px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.link{color:var(--acc);cursor:pointer;font-size:13px}
.edgrid{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:14px;align-items:start}
.chk{display:flex;gap:8px;align-items:center;margin:5px 0;color:var(--ink);font-size:14px}.chk input{width:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
@media(max-width:1000px){.edgrid{grid-template-columns:1fr}}
.grp .sub{display:none;background:#12283d}.grp:hover .sub,.grp.open .sub{display:block}.grp .sub a{padding-left:30px;font-size:13px}
.sresbox{position:absolute;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:5px;z-index:5;max-height:240px;overflow:auto}
.sresbox:empty{display:none}.sres{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}.sres:hover{background:#eef6f9}
@media(max-width:760px){#side{position:static;width:auto}#side nav{display:flex;overflow:auto}#side a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}#side a.on{border-bottom-color:#5cc8e6}#main{margin:0;padding:12px}#app{display:none}}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <h1>Stock &amp; Invoice System</h1>
    <div class="tabs" id="tabs"><a id="t_in" class="on" onclick="lview('in')">Sign in</a><a id="t_up" onclick="lview('up')">Create account</a></div>

    <div id="v_in">
      <div class="f"><label>Username or email</label><input id="lu" autocomplete="username"></div>
      <div class="f"><label>Password</label><div class="pw"><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button type="button" class="eye" onclick="eye('lp',this)" aria-label="Show or hide password">&#128065;</button></div></div>
      <button class="btn" style="width:100%" onclick="doLogin()">Sign in</button>
      <p style="margin:12px 0 0"><a class="link" onclick="lview('fp')">Forgot password?</a></p>
    </div>

    <div id="v_up" style="display:none">
      <div class="f"><label>Username</label><input id="su" autocomplete="username"></div>
      <div class="f"><label>Email</label><input id="se" type="email" autocomplete="email"></div>
      <div class="f"><label>Password (min 6 characters)</label><div class="pw"><input id="sp" type="password" autocomplete="new-password"><button type="button" class="eye" onclick="eye('sp',this)" aria-label="Show or hide password">&#128065;</button></div></div>
      <div class="f"><label>Confirm password</label><div class="pw"><input id="sp2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doSignup()"><button type="button" class="eye" onclick="eye('sp2',this)" aria-label="Show or hide password">&#128065;</button></div></div>
      <button class="btn" style="width:100%" onclick="doSignup()">Create account</button>
      <p style="margin:12px 0 0;font-size:12.5px">New accounts can sign in after an admin approves them.</p>
    </div>

    <div id="v_fp" style="display:none">
      <h3 style="margin-bottom:6px">Reset password</h3>
      <p>Enter your email or username. We will send a link to set a new password.</p>
      <div class="f"><label>Email or username</label><input id="fe" onkeydown="if(event.key==='Enter')doForgot()"></div>
      <button class="btn" style="width:100%" onclick="doForgot()">Send reset link</button>
      <p style="margin:12px 0 0"><a class="link" onclick="lview('in')">Back to sign in</a></p>
    </div>

    <div id="v_rp" style="display:none">
      <h3 style="margin-bottom:6px">Set a new password</h3>
      <div class="f"><label>New password (min 6 characters)</label><div class="pw"><input id="rp1" type="password" autocomplete="new-password"><button type="button" class="eye" onclick="eye('rp1',this)" aria-label="Show or hide password">&#128065;</button></div></div>
      <div class="f"><label>Confirm new password</label><div class="pw"><input id="rp2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doReset()"><button type="button" class="eye" onclick="eye('rp2',this)" aria-label="Show or hide password">&#128065;</button></div></div>
      <button class="btn" style="width:100%" onclick="doReset()">Save new password</button>
    </div>

    <p id="lmsg" style="color:var(--bad);margin:12px 0 0"></p>
  </div>
</div>

<div id="app">
  <aside id="side">
    <div class="brand"><span id="coName">Company</span><small>Stock &amp; Invoice</small></div>
    <nav id="nav"></nav>
    <div class="me"><div id="meName"></div><a onclick="pwModal()" style="padding:4px 0;cursor:pointer;color:#fff;border:0">Change password</a><a onclick="logout()" style="padding:4px 0;cursor:pointer;color:#fff;border:0">Sign out</a></div>
  </aside>
  <main id="main"></main>
</div>

<div id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
/* ===================== CONFIG: paste your Supabase values ===================== */
const CFG = { url: 'https://ybevwcxgfnwfyadgbfdl.supabase.co', key: 'sb_publishable_n0qwxibzfTZ8NQFw08jbjg_9mBL7IAh' };
const EMAIL_DOMAIN = '@laptopcare.app';   // usernames are stored as username@laptopcare.app
/* ============================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n || 0).toLocaleString('en-LK', {minimumFractionDigits:2, maximumFractionDigits:2});
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
let sb, me, items = [], settings = {};
const isAdmin = () => me && me.role === 'admin';
const hasP = k => isAdmin() || (me && (me.perms || []).includes(k));
const PERMS=[['invoice','Create invoice'],['invoices','View / reprint invoices'],['stock','Stock check'],['serial','Serial number check'],['grn','GRN (goods received)'],['items','Add items and categories'],['customers','Create customers'],['suppliers','Create suppliers'],['reports','Sales reports'],['cost','See cost prices'],['price','Change price on invoice'],['backdate','Change invoice / GRN date']];
const DEF_PERMS=['invoice','invoices'];
const permBoxes=(pre,sel)=>PERMS.map(([k,l])=>`<label class="chk"><input type="checkbox" id="${pre}_${k}" ${sel.includes(k)?'checked':''}> ${l}</label>`).join('');
const permRead=pre=>PERMS.filter(([k])=>$('#'+pre+'_'+k).checked).map(([k])=>k);

function toast(msg, err){const t=$('#toast');t.textContent=msg;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',err?6000:2500)}
function openModal(html,w){$('#modal').innerHTML=html;$('#modal').style.maxWidth=w||'560px';$('#modalBg').style.display='block'}
function closeModal(){$('#modalBg').style.display='none'}
function addMonths(d,m){const x=new Date(d);x.setMonth(x.getMonth()+Number(m||0));return x.toISOString().slice(0,10)}
async function run(p){const r=await p;if(r.error){toast(r.error.code==='23503'?'This record is used elsewhere, so it cannot be deleted.':(r.error.code==='23505'?'That value already exists (duplicate).':r.error.message),true);throw r.error}return r.data}
async function allRows(build){let out=[],from=0;for(;;){const {data,error}=await build().range(from,from+999);if(error){toast(error.message,true);throw error}out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
const WOPTS=[[0,'No warranty'],[1,'1 month'],[3,'3 months'],[6,'6 months'],[12,'1 year'],[18,'18 months'],[24,'2 years'],[36,'3 years'],[48,'4 years'],[60,'5 years']];
function wOpts(v){v=+v||0;const l=WOPTS.slice();if(!l.some(x=>x[0]===v))l.push([v,v+' months']);l.sort((a,b)=>a[0]-b[0]);return l.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('')+'<option value="custom">Other (type months)…</option>'}
function wPick(sel){if(sel.value!=='custom')return;const n=parseInt(prompt('Warranty period in months'));if(n>=0){const o=document.createElement('option');o.value=n;o.textContent=n+' months';sel.insertBefore(o,sel.lastChild);sel.value=String(n)}else sel.value='0'}
function wtyText(m){m=+m||0;if(!m)return '';return m%12===0?(m/12)+(m===12?' YEAR':' YEARS'):m+(m===1?' MONTH':' MONTHS')}
function printHtml(title,body,css){
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  f.contentDocument.open();f.contentDocument.write(`<html><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:A4;margin:12mm}body{font:12px/1.4 Arial,sans-serif;color:#000}h2{margin:0 0 4px}table{width:100%;border-collapse:collapse;margin:6px 0 14px}th,td{border:1px solid #888;padding:4px 6px;text-align:left}th{background:#eee}.r{text-align:right}.tag{font-weight:700}${css||''}</style></head><body>${body}</body></html>`);f.contentDocument.close();
  setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),60000)},400);
}

/* ---------------- Auth ---------------- */
const RECOVERY = location.hash.includes('type=recovery');
let recovering = RECOVERY;
function msg(t,ok){const m=$('#lmsg');m.textContent=t||'';m.style.color=ok?'var(--ok)':'var(--bad)'}
function lview(v){
  ['in','up','fp','rp'].forEach(x=>{$('#v_'+x).style.display=x===v?'block':'none'});
  $('#tabs').style.display=(v==='in'||v==='up')?'flex':'none';
  $('#t_in').classList.toggle('on',v!=='up');$('#t_up').classList.toggle('on',v==='up');msg('');
}
function eye(id,b){const i=$('#'+id),show=i.type==='password';i.type=show?'text':'password';b.classList.toggle('on',show)}
function pwf(id,label){return `<div class="row"><label>${label}</label><div class="pw"><input id="${id}" type="password" autocomplete="new-password"><button type="button" class="eye" onclick="eye('${id}',this)" aria-label="Show or hide password">&#128065;</button></div></div>`}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function emailFor(u){const {data}=await sb.rpc('email_for_username',{u});return data||null}

if (CFG.url.startsWith('YOUR')) {
  msg('Setup needed: put your Supabase URL and key at the top of index.html.');
} else {
  sb = supabase.createClient(CFG.url, CFG.key);
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { recovering = true; lview('rp'); } });
  if (RECOVERY) lview('rp');
  sb.auth.getSession().then(({data}) => { if (data.session && !recovering) afterLogin(data.session.user.id); });
}

async function doLogin(){
  const u=$('#lu').value.trim().toLowerCase(), p=$('#lp').value;
  msg('');
  if(!sb||!u||!p)return;
  let email=u;
  if(!u.includes('@')) email=(await emailFor(u))||(u+EMAIL_DOMAIN);
  const {data,error}=await sb.auth.signInWithPassword({email,password:p});
  if(error){msg(error.message==='Invalid login credentials'?'Wrong username or password.':'Login error: '+error.message);console.error(error);return}
  afterLogin(data.user.id);
}

async function doSignup(){
  const u=$('#su').value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,''), em=$('#se').value.trim().toLowerCase(), p=$('#sp').value, p2=$('#sp2').value;
  if(!u)return msg('Enter a username (letters, numbers, . _ -)');
  if(!em.includes('@'))return msg('Enter a valid email');
  if(p.length<6)return msg('Password must be at least 6 characters');
  if(p!==p2)return msg('Passwords do not match');
  if(await emailFor(u))return msg('That username is already taken');
  const {error}=await sb.auth.signUp({email:em,password:p,options:{data:{username:u}}});
  if(error)return msg(error.message);
  await sb.auth.signOut();
  lview('in');msg('Account created. You can sign in after an admin approves it.',true);
}

async function doForgot(){
  let em=$('#fe').value.trim().toLowerCase();
  if(!em)return msg('Enter your email or username');
  if(!em.includes('@')){em=await emailFor(em);if(!em){lview('in');return msg('If that account exists, a reset link was sent.',true)}}
  const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  if(error)return msg(error.message);
  lview('in');msg('If that account exists, a reset link was sent. Check your inbox and spam folder.',true);
}

async function doReset(){
  const p=$('#rp1').value,p2=$('#rp2').value;
  if(p.length<6)return msg('Password must be at least 6 characters');
  if(p!==p2)return msg('Passwords do not match');
  const {error}=await sb.auth.updateUser({password:p});
  if(error)return msg(error.message);
  await sb.auth.signOut();recovering=false;history.replaceState(null,'',location.pathname);
  lview('in');msg('Password changed. Sign in with your new password.',true);
}

function pwModal(){
  openModal(`<h3>Change password</h3>${pwf('c1','New password (min 6 characters)')}${pwf('c2','Confirm new password')}
  <div class="bar" style="margin-top:14px;justify-content:flex-end"><div style="flex:0"><button class="btn sec" onclick="closeModal()">Cancel</button></div><div style="flex:0"><button class="btn" onclick="changePw()">Save</button></div></div>`);
}
async function changePw(){
  const p=$('#c1').value,p2=$('#c2').value;
  if(p.length<6)return toast('Password must be at least 6 characters',true);
  if(p!==p2)return toast('Passwords do not match',true);
  const {error}=await sb.auth.updateUser({password:p});
  if(error)return toast(error.message,true);
  closeModal();toast('Password changed');
}
function buildNav(){
  const a=[],L=(k,l)=>`<a id="n_${k}" onclick="go('${k}')">${l}</a>`;
  a.push(L('dash','Dashboard'));
  [['stock','Stock check','stock'],['serial','Serial check','serial'],['invoice','New invoice','invoice'],['invoices','Invoices','invoices'],['grn','GRN','grn'],['reports','Sales report','reports']].forEach(([k,l,pm])=>{if(hasP(pm))a.push(L(k,l))});
  const gen=[['items','Items','items'],['cats','Categories','items'],['customers','Customers','customers'],['suppliers','Suppliers','suppliers'],['reps','Sales reps','ADMIN']].filter(x=>x[2]==='ADMIN'?isAdmin():hasP(x[2]));
  if(gen.length)a.push(`<div class="grp"><a onclick="this.parentNode.classList.toggle('open')">General &#9662;</a><div class="sub">${gen.map(g=>L(g[0],g[1])).join('')}</div></div>`);
  if(isAdmin())a.push(L('users','Users'),L('settings','Invoice editor'));
  $('#nav').innerHTML=a.join('');
}
async function afterLogin(uid){
  const {data:pr}=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();
  if(!pr||!pr.active){await sb.auth.signOut();msg('Your account is waiting for admin approval, or it was disabled.');return}
  me=pr;
  const {data:st}=await sb.from('settings').select('*');
  settings={};(st||[]).forEach(r=>settings[r.key]=r.value);
  $('#coName').textContent=settings.company_name||'Company';
  $('#meName').textContent=me.username+' ('+me.role+')';
  $('#login').style.display='none';$('#app').style.display='block';
  buildNav();
  go('dash');
}
async function logout(){await sb.auth.signOut();location.reload()}

const PAGES={};
async function go(p){
  const need={stock:'stock',serial:'serial',invoice:'invoice',invoices:'invoices',grn:'grn',items:'items',cats:'items',customers:'customers',suppliers:'suppliers',reports:'reports'};
  if((need[p]&&!hasP(need[p]))||((p==='users'||p==='settings'||p==='reps')&&!isAdmin()))p='dash';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.remove('on'));
  const n=$('#n_'+p);if(n){n.classList.add('on');const g=n.closest('.grp');if(g)g.classList.add('open')}
  $('#main').innerHTML='<p class="mut">Loading…</p>';
  try{await PAGES[p]()}catch(e){console.error(e)}
}
async function loadItems(){items=await run(sb.from('stock_view').select('*').order('name'))}

/* ---------------- Dashboard ---------------- */
PAGES.dash=async()=>{
  const c=[];
  if(hasP('stock')||hasP('cost')){
    await loadItems();
    if(hasP('stock'))c.push([items.length,'Items'],[items.reduce((a,i)=>a+Number(i.in_stock),0),'Units in stock'],[items.filter(i=>i.in_stock<=0).length,'Items out of stock']);
    if(hasP('cost'))c.push(['Rs. '+money(items.reduce((a,i)=>a+Number(i.in_stock)*Number(i.cost),0)),'Stock value at cost']);
  }
  if(hasP('invoices')){
    const inv=await run(sb.from('invoices').select('total').eq('inv_date',today()));
    c.push(['Rs. '+money(inv.reduce((a,r)=>a+Number(r.total),0)),'Sales today ('+inv.length+' invoices)']);
  }
  const q=[['invoice','New invoice','btn'],['grn','New GRN','btn sec'],['stock','Stock check','btn sec'],['serial','Serial check','btn sec'],['reports','Sales report','btn sec']].filter(x=>hasP(x[0]));
  $('#main').innerHTML=`<div class="top"><h2>Dashboard</h2></div>`+
   (c.length?`<div class="grid">${c.map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`:'')+

let STK=[];
PAGES.stock=async()=>{
  await Promise.all([loadItems(),loadCats()]);
  $('#main').innerHTML=`<div class="top"><h2>Stock check</h2><button class="btn sec" onclick="stockPrint()">Print</button></div>
  <div class="card"><div class="bar">
   <div><label>Category</label><select id="f_cat" onchange="stockTable()"><option value="">All categories</option>${CATS.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
   <div><label>Stock as on date</label><input id="f_date" type="date" value="${today()}" onchange="stockLoad()"></div>
   <div style="flex:2"><label>Search</label><input id="fq" placeholder="Code or name" oninput="stockTable()"></div>
   <div style="flex:0"><label class="chk" style="margin-bottom:8px;white-space:nowrap"><input type="checkbox" id="f_nz" onchange="stockTable()"> Hide zero</label></div></div></div>
  <div class="tw"><table id="stt"></table></div>`;
  stockLoad();
};
async function stockLoad(){
  const d=$('#f_date').value||today();
  if(d>=today()){STK=items.map(i=>({...i,qty_on:Number(i.in_stock)}))}
  else{
    const r=await allRows(()=>sb.rpc('stock_asof',{d}));const m={};r.forEach(x=>{m[x.item_id]=(m[x.item_id]||0)+Number(x.qty)});
    STK=items.map(i=>({...i,qty_on:m[i.id]||0}));
  }
  stockTable();
}
function stockTable(){
  const q=($('#fq').value||'').toLowerCase(),cat=$('#f_cat').value,nz=$('#f_nz').checked,cost=hasP('cost');
  const rows=STK.filter(i=>(!cat||i.category_id==cat)&&(i.name+' '+(i.code||'')).toLowerCase().includes(q)&&(!nz||i.qty_on>0));
  const groups={};rows.forEach(i=>{const k=i.category_name||'No category';(groups[k]=groups[k]||[]).push(i)});
  let h=`<thead><tr><th>Code</th><th>Item</th><th class="r">Qty</th>${cost?'<th class="r">Cost</th><th class="r">Value</th>':''}<th class="r">Selling price</th><th>Warranty</th></tr></thead><tbody>`,tq=0,tv=0;
  Object.keys(groups).sort().forEach(k=>{
    const g=groups[k],gq=g.reduce((a,i)=>a+i.qty_on,0);tq+=gq;
    h+=`<tr style="background:#eef3f7"><td colspan="${cost?7:5}"><b>${esc(k)}</b> <span class="mut">(${gq} units)</span></td></tr>`;
    g.forEach(i=>{const v=i.qty_on*Number(i.cost);tv+=v;
      h+=`<tr><td>${esc(i.code)}</td><td><b>${esc(i.name)}</b></td><td class="r"><span class="tag ${i.qty_on>0?'ok':'bad'}">${i.qty_on}</span></td>${cost?`<td class="r">${money(i.cost)}</td><td class="r">${money(v)}</td>`:''}<td class="r">${money(i.price)}</td><td>${wtyText(i.warranty_months)||'-'}</td></tr>`});
  });
  h+=`</tbody><tfoot><tr><th colspan="2">Total</th><th class="r">${tq}</th>${cost?`<th></th><th class="r">${money(tv)}</th>`:''}<th></th><th></th></tr></tfoot>`;
  $('#stt').innerHTML=h;
}
function stockPrint(){
  const c=$('#f_cat'),cn=c.options[c.selectedIndex].text;
  printHtml('Stock report',`<h2>Stock report</h2><div>As on ${$('#f_date').value} | ${esc(cn)}</div><table>${$('#stt').innerHTML}</table>`);
}

function grnAdd(){G.push({cat:'',item_id:'',isNew:false,nw:{name:'',ts:true},qty:1,cost:'',price:'',w:0,details:'',serials:[]});grnRender()}
function grnDel(i){G.splice(i,1);grnRender()}
function grnCat(i,v){G[i].cat=v;G[i].item_id='';G[i].isNew=false;grnRender()}
function grnItem(i,v){
  const l=G[i];

function grnCode(i){
  const c=CATS.find(x=>x.id==G[i].cat);if(!c)return 'Choose a category first';
  let n=c.next_no;for(let j=0;j<i;j++)if(G[j].isNew&&G[j].cat==G[i].cat)n++;

}
function grnTracks(l){if(l.isNew)return l.nw.ts;const it=items.find(x=>x.id==l.item_id);return it?it.track_serial:true}
function srHtml(i){
  const l=G[i];
  return Array.from({length:l.qty},(_,k)=>`<input id="s_${i}_${k}" placeholder="Serial ${k+1}" value="${esc(l.serials[k]||'')}" oninput="G[${i}].serials[${k}]=this.value" onkeydown="srKey(event,${i},${k})" onpaste="srPaste(event,${i},${k})">`).join('');
}
function srKey(e,i,k){if(e.key==='Enter'){e.preventDefault();const nx=$('#s_'+i+'_'+(k+1));if(nx)nx.focus()}}
function srPaste(e,i,k){
  const t=(e.clipboardData||window.clipboardData).getData('text');
  const parts=t.split(/[\n\r,;\t]+/).map(x=>x.trim()).filter(Boolean);
  if(parts.length<2)return;
  e.preventDefault();
  const l=G[i];l.qty=Math.min(500,Math.max(l.qty,k+parts.length));
  parts.forEach((x,j)=>{l.serials[k+j]=x});grnRender();
}
function grnQty(i,v){
  const n=Math.min(500,Math.max(1,parseInt(v)||1));G[i].qty=n;if(G[i].serials.length>n)G[i].serials.length=n;
  const sr=$('#sr'+i);if(sr)sr.innerHTML=srHtml(i);const sc=$('#sc'+i);if(sc)sc.textContent=n;grnTotal();
}

     ${ts?`<div style="margin-top:8px"><label>Serial numbers: <b id="sc${i}">${l.qty}</b> needed. Type or scan one by one, press Enter for the next box.</label>

}
function grnTotal(){$('#gt').textContent='Total cost: Rs. '+money(G.reduce((a,l)=>a+(+l.qty||0)*(+l.cost||0),0))}
async function grnSave(){
  const lines=[];
  for(let i=0;i<G.length;i++){
    const l=G[i],ts=grnTracks(l);
    let nm='';
    if(l.isNew){nm=l.nw.name.trim();if(!nm)return toast('Enter the new item name on line '+(i+1),true)}
    else{const it=items.find(x=>x.id==l.item_id);if(!it)return toast('Select an item on line '+(i+1),true);nm=it.name}
    if(l.cost===''||l.price==='')return toast('Enter cost and selling price for '+nm,true);
    let serials=[];
    if(ts){
      serials=Array.from({length:l.qty},(_,k)=>String(l.serials[k]||'').trim());
      if(serials.some(x=>!x))return toast('Fill all '+l.qty+' serial numbers for '+nm,true);
      if(new Set(serials).size!==serials.length)return toast('Duplicate serial number on line '+(i+1),true);
    }
    lines.push({item_id:l.isNew?null:+l.item_id,new_item:l.isNew?{name:nm,category_id:l.cat||'',track_serial:l.nw.ts}:null,qty:l.qty,cost:+l.cost,price:+l.price,warranty_months:+l.w||0,details:l.details.trim(),serials});
  }
  if(!lines.length)return toast('Add at least one line',true);
  const sid=$('#g_sup').value,sup=SUPS.find(x=>x.id==sid);
  await run(sb.rpc('create_grn',{p:{grn_date:$('#g_date').value,supplier:sup?sup.name:'',supplier_id:sid||'',ref_no:$('#g_ref').value,note:$('#g_note').value,lines}}));
  toast('GRN saved');go('grn');
}

}

async function grnEditSave(){
  const {g,gi,sr}=window._ge,sid=$('#ge_s').value,sup=SUPS.find(x=>x.id==sid);
  await run(sb.from('grn').update({grn_date:$('#ge_d').value,supplier:sup?sup.name:g.supplier,supplier_id:sid||null,ref_no:$('#ge_r').value,note:$('#ge_n').value}).eq('id',g.id));
  let tot=0;
  for(let k=0;k<gi.length;k++){
    const l=gi[k],c=+$('#gl_c'+k).value||0,p=+$('#gl_p'+k).value||0,w=+$('#gl_w'+k).value||0,dt=$('#gl_d'+k).value.trim()||null;
    await run(sb.from('grn_items').update({cost:c,price:p,warranty_months:w,details:dt}).eq('id',l.id));
    const ck=$('#gl_k'+k).value;if((+ck||null)!==(l.items?.category_id||null))await run(sb.from('items').update({category_id:+ck||null}).eq('id',l.item_id));
    tot+=l.qty*c;
    await run(sb.from('serials').update({cost:c,price:p,warranty_months:w,details:dt}).eq('grn_id',g.id).eq('item_id',l.item_id).eq('status','in_stock'));
  }
  for(const s of sr){const el=$('#gs_'+s.id);if(el&&!el.disabled&&el.value.trim()&&el.value.trim()!==s.serial)await run(sb.from('serials').update({serial:el.value.trim()}).eq('id',s.id))}
  await run(sb.from('grn').update({total:tot}).eq('id',g.id));
  closeModal();toast('GRN updated');go('grn');
}

async function findSerial(sn,itemId){
  let b=sb.from('serials').select('*').eq('serial',sn);if(itemId)b=b.eq('item_id',itemId);
  const d=await run(b.maybeSingle());
  if(!d||!(d.status==='in_stock'||(EDITING&&d.invoice_id===EDITING)))return null;
  return d;
}
const availFor=id=>{const it=items.find(x=>x.id===id);return (it?Number(it.in_stock):0)+L.filter(l=>l.item_id===id).reduce((a,l)=>a+(l.orig||0),0)};
async function invAdd(){
  let it=items.find(x=>x.id==$('#a_item').value);
  const sn=$('#a_sn').value.trim();
  if(!it&&sn){
    const d=await findSerial(sn,null);
    if(!d)return toast('Serial not in stock',true);
    it=items.find(x=>x.id===d.item_id);
    if(L.some(l=>l.serial===sn))return toast('Already added',true);
    L.push({item_id:it.id,description:it.name,details:d.details||it.description||'',code:it.code||'',serial:sn,qty:1,price:Number(d.price||it.price),w:d.warranty_months});
    $('#a_sn').value='';return invRender();
  }
  if(!it)return toast('Select an item',true);
  const price=+$('#a_pr').value;
  if(it.track_serial){
    if(!sn)return toast('Enter the serial number',true);
    if(L.some(l=>l.serial===sn))return toast('Already added',true);
    const d=await findSerial(sn,it.id);
    if(!d)return toast('That serial is not in stock for this item',true);
    L.push({item_id:it.id,description:it.name,details:d.details||it.description||'',code:it.code||'',serial:sn,qty:1,price:hasP('price')?price:Number(d.price||it.price),w:d.warranty_months});
    $('#a_sn').value='';
  }else{
    const q=+$('#a_qty').value||1,have=L.filter(l=>l.item_id===it.id).reduce((a,l)=>a+l.qty,0);
    if(have+q>availFor(it.id))return toast('Only '+availFor(it.id)+' in stock',true);
    L.push({item_id:it.id,description:it.name,details:it.description||'',code:it.code||'',serial:null,qty:q,orig:0,price:hasP('price')?price:Number(it.price),w:it.warranty_months});
  }
  invRender();
}
function invQty(i,v){
  const q=Math.max(1,parseInt(v)||1),l=L[i],others=L.filter((x,k)=>k!==i&&x.item_id===l.item_id).reduce((a,x)=>a+x.qty,0);
  if(q+others>availFor(l.item_id)){toast('Only '+availFor(l.item_id)+' in stock',true);return invRender()}
  l.qty=q;invRender();
}
function invRender(){
  $('#vl').innerHTML=L.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.code)}</td><td><b>${esc(l.description)}</b><div class="mut" style="white-space:pre-line">${esc(l.details)}</div></td><td>${esc(l.serial)}</td><td>${wtyText(l.w)||'-'}</td>

  invTotals();
}
const invTotal=()=>L.reduce((a,l)=>a+l.qty*l.price,0)-(+(($('#v_dc')||{}).value)||0);
function invTotals(){
  const s=L.reduce((a,l)=>a+l.qty*l.price,0),d=+($('#v_dc')||{}).value||0;
  $('#vt').innerHTML=`<div><span>Subtotal</span><span>${money(s)}</span></div><div><span>Discount</span><span>${money(d)}</span></div><div class="g"><span>Total (Rs.)</span><span>${money(s-d)}</span></div>`;
  payRender();
}

/* ----- payments (cash / card / bank transfer / cheque, more than one) ----- */
function payRender(){
  const t=invTotal();
  if(PAY.length===1&&PAY[0].auto)PAY[0].amt=t>0?String(Math.round(t*100)/100):'';
  $('#paybox').innerHTML=PAY.map((p,i)=>`<div class="line" style="padding:8px"><div class="bar">
    <div style="flex:0 0 150px"><label>Method</label><select onchange="payM(${i},this.value)">${PAYM.map(m=>`<option ${m===p.m?'selected':''}>${m}</option>`).join('')}</select></div>
    <div><label>Amount</label><input type="number" step="0.01" value="${esc(p.amt)}" oninput="payA(${i},this.value)"></div>
    ${p.m==='Card'?`<div style="flex:0 0 120px"><label>Card last 4 digits</label><input maxlength="4" inputmode="numeric" value="${esc(p.last4||'')}" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,4);PAY[${i}].last4=this.value"></div><div><label>Card holder name</label><input value="${esc(p.holder||'')}" oninput="PAY[${i}].holder=this.value"></div>`:''}
    ${p.m==='Bank transfer'?`<div style="flex:2"><label>Bank / reference (optional)</label><input value="${esc(p.ref||'')}" oninput="PAY[${i}].ref=this.value"></div>`:''}
    ${p.m==='Cheque'?`<div><label>Cheque no</label><input value="${esc(p.chq_no||'')}" oninput="PAY[${i}].chq_no=this.value"></div><div><label>Bank</label><input value="${esc(p.chq_bank||'')}" oninput="PAY[${i}].chq_bank=this.value"></div><div><label>Cheque date</label><input type="date" value="${esc(p.chq_date||'')}" oninput="PAY[${i}].chq_date=this.value"></div>`:''}
    <div style="flex:0"><button class="btn sec sm" onclick="payDel(${i})">x</button></div></div></div>`).join('')||'<div class="mut">No payment entered: the whole amount stays on credit.</div>';
  paySum();
}
function paySum(){
  const t=invTotal(),paid=PAY.reduce((a,p)=>a+(+p.amt||0),0),b=t-paid;
  $('#paysum').innerHTML=`Paid: <b>${money(paid)}</b> &nbsp; ${b>0.005?`Balance on credit: <b style="color:var(--bad)">${money(b)}</b>`:(b<-0.005?`<b style="color:var(--bad)">Payments are ${money(-b)} more than the total</b>`:'<b style="color:var(--ok)">Fully paid</b>')}`;
}
function payAdd(){const rem=invTotal()-PAY.reduce((a,p)=>a+(+p.amt||0),0);PAY.forEach(p=>p.auto=false);PAY.push({m:'Cash',amt:rem>0?String(Math.round(rem*100)/100):'',auto:false});payRender()}
function payM(i,m){PAY[i].m=m;payRender()}
function payA(i,v){PAY[i].amt=v;PAY[i].auto=false;paySum()}
function payDel(i){PAY.splice(i,1);payRender()}

async function invSave(){
  if(!L.length)return toast('Add at least one item',true);
  const total=invTotal(),pays=PAY.filter(p=>+p.amt>0).map(p=>({method:p.m,amount:+p.amt,last4:p.last4||'',holder:p.holder||'',ref:p.ref||'',chq_no:p.chq_no||'',chq_bank:p.chq_bank||'',chq_date:p.chq_date||''}));
  const paid=pays.reduce((a,p)=>a+p.amount,0);
  if(paid>total+0.005)return toast('Payments are more than the invoice total',true);
  if(pays.some(p=>p.method==='Card'&&p.last4&&p.last4.length!==4))return toast('Card last digits must be exactly 4 numbers',true);
  const methods=[...new Set(pays.map(p=>p.method))];if(total-paid>0.005)methods.push('Credit');
  const fmt=$('#v_fmt').value;localStorage.setItem('fmt',fmt);localStorage.setItem('rep',$('#v_rep').value);
  const p={inv_date:$('#v_date').value,customer_id:CUST.id||'',customer_code:CUST.code||'',customer_name:$('#v_cn').value,phone:$('#v_ph').value,address:$('#v_ad').value,pay_method:methods.join(' + ')||'Credit',payments:pays,po_no:$('#v_po').value,rep_name:$('#v_rep').value,note:$('#v_nt').value,discount:+$('#v_dc').value||0,
    lines:L.map(l=>({item_id:l.item_id,description:l.description,details:l.details,serial:l.serial,qty:l.qty,unit_price:l.price,warranty_months:+l.w||0}))};
  let id;
  if(EDITING){await run(sb.rpc('update_invoice',{inv:EDITING,p}));id=EDITING}else id=await run(sb.rpc('create_invoice',{p}));
  toast(EDITING?'Invoice updated':'Invoice saved');
  await printInvoice(id,fmt);
  go(hasP('invoices')?'invoices':'invoice');
}

const LY_DEF={logo:'',logoH:80,align:'right',title:'INVOICE',titleSize:26,nameSize:26,email:'',web:'',showCode:true,showSerial:true,showWarranty:true,showUntil:false,termsTitle:'TERMS & CONDITIONS',terms:'',footer:'Thank you for your business.',showSig:true,sigL:'Prepared by',sigM:'',sigR:'Customer signature',fontSize:0,fmt:'a4',off:{},txt:{},margin:10,border:true,bw:1.5,tblH:110};
function getLY(){let o={};try{o=JSON.parse(settings.invoice_layout||'{}')}catch(e){}
  const ly={...LY_DEF,...o,footer:(o.footer!==undefined?o.footer:(settings.invoice_footer||LY_DEF.footer))};
  ly.off=JSON.parse(JSON.stringify(ly.off||{}));
  Object.keys(ly.off).forEach(k=>{const v=ly.off[k]||[];ly.off[k]=v.length===3?[v[0],v[1],null,null]:[v[0]||0,v[1]||0,v[2]||null,v[3]||null]});
  ly.txt=ly.txt||{};
  return ly}
function coInfo(){return {n:settings.company_name||'Company',a:settings.company_addr||'',p:settings.company_phone||''}}

function payInfo(inv){const pays=Array.isArray(inv.payments)?inv.payments:[];const paid=pays.reduce((a,p)=>a+(Number(p.amount)||0),0);return {has:Array.isArray(inv.payments)&&pays.length>0,pays,paid,bal:Math.max(0,Number(inv.total)-paid)}}
function payLbl(p){
  let s=p.method;
  if(p.method==='Card'){const x=[p.last4?'**** '+p.last4:'',p.holder||''].filter(Boolean).join(' ');if(x)s+=' ('+x+')'}
  else if(p.method==='Bank transfer'){if(p.ref)s+=' ('+p.ref+')'}
  else if(p.method==='Cheque'){const x=[p.chq_no?'#'+p.chq_no:'',p.chq_bank||''].filter(Boolean).join(' ');if(x)s+=' ('+x+')'}
  return s;
}

async function printInvoice(id,fmt){
  const inv=await run(sb.from('invoices').select('*').eq('id',id).single());
  const ln=await run(sb.from('invoice_items').select('*').eq('invoice_id',id).order('id'));
  const doc=invDoc(inv,ln,fmt,coInfo(),getLY(),false);
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  f.contentDocument.open();f.contentDocument.write(doc);f.contentDocument.close();
  setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),60000)},400);
}

function clampMove(b){var r=b.getBoundingClientRect(),p=box(),dx=0,dy=0;if(r.left<p.left)dx=p.left-r.left;else if(r.right>p.right)dx=p.right-r.right;if(r.top<p.top)dy=p.top-r.top;else if(r.bottom>p.bottom)dy=p.bottom-r.bottom;b.style.left=((parseFloat(b.style.left)||0)+dx)+'px';b.style.top=((parseFloat(b.style.top)||0)+dy)+'px'}
function clampSize(b){var r=b.getBoundingClientRect(),p=box();if(r.right>p.right)b.style.width=Math.max(20,r.width-(r.right-p.right))+'px';if(r.bottom>p.bottom)b.style.height=Math.max(12,r.height-(r.bottom-p.bottom))+'px'}
function finish(){if(!editing)return;var z=editing;editing=null;z.removeAttribute('contenteditable');z.classList.remove('ed');var t=z.innerText.replace(/\\u00a0/g,' ').replace(/\\n+$/,'');parent.postMessage({edtext:z.parentNode.getAttribute('data-b'),text:t},'*')}
document.addEventListener('mousedown',function(e){
 if(editing&&editing.contains(e.target))return;
 if(editing)finish();
 var b=e.target.closest('.bk');if(!b){pick(null);return}
 e.preventDefault();pick(b);cur=b;sx=e.clientX;sy=e.clientY;ox=parseFloat(b.style.left)||0;oy=parseFloat(b.style.top)||0;
 var r=b.getBoundingClientRect();w0=r.width;h0=r.height;var h=e.target.getAttribute&&e.target.getAttribute('data-h');mode=h?h:'move'});
document.addEventListener('mousemove',function(e){if(!cur)return;var dx=e.clientX-sx,dy=e.clientY-sy;
 if(mode==='move'){cur.style.left=(ox+dx)+'px';cur.style.top=(oy+dy)+'px';clampMove(cur)}
 else{if(mode==='r'||mode==='c')cur.style.width=Math.max(20,w0+dx)+'px';if(mode==='b'||mode==='c')cur.style.height=Math.max(12,h0+dy)+'px';clampSize(cur)}});
document.addEventListener('mouseup',function(){if(!cur)return;parent.postMessage({edrag:cur.getAttribute('data-b'),x:parseFloat(cur.style.left)||0,y:parseFloat(cur.style.top)||0,w:cur.style.width?parseFloat(cur.style.width):null,h:cur.style.height?parseFloat(cur.style.height):null},'*');cur=null;mode=null});

function wrapTxt(t,w){const out=[];String(t||'').split('\n').forEach(par=>{let line='';par.split(' ').forEach(wd=>{if((line+' '+wd).trim().length>w){out.push(line);line=wd}else line=(line+' '+wd).trim()});out.push(line)});return out}
function dotText(inv,ln,co,ly,full){
  const W=80,p=(s,n)=>String(s??'').slice(0,n).padEnd(n),r=(s,n)=>String(s??'').slice(0,n).padStart(n),c=s=>' '.repeat(Math.max(0,(W-s.length)>>1))+s,bar='-'.repeat(W);
  const ov=n=>(ly.txt&&typeof ly.txt[n]==='string')?ly.txt[n]:null,pi=payInfo(inv);
  const head=ov('company')!==null?ov('company').split('\n').filter(Boolean).map((x,i)=>c(i?x:x.toUpperCase())):[c(co.n.toUpperCase()),...String(co.a||'').split('\n').filter(Boolean).map(x=>c(x)),c([co.p,ly.email,ly.web].filter(Boolean).join('  '))];
  let o=[...head,bar,
    p((ov('title')!==null?ov('title'):ly.title)+': '+inv.inv_no,40)+r('Date: '+inv.inv_date,40),
    p('Customer: '+(inv.customer_name||'')+(inv.customer_code?' ('+inv.customer_code+')':''),W),p('Phone: '+(inv.phone||''),W),p('Address: '+(inv.address||''),W),
    p('Terms: '+(inv.pay_method||''),40)+r('Rep: '+(inv.rep_name||''),40),bar,
    p('No',3)+' '+p('Code',10)+' '+p('Description',30)+' '+r('Qty',4)+' '+r('Price',12)+' '+r('Amount',14),bar];
  ln.forEach((l,i)=>{
    o.push(p(i+1,3)+' '+p(l.code,10)+' '+p(l.description,30)+' '+r(l.qty,4)+' '+r(money(l.unit_price),12)+' '+r(money(l.amount),14));
    if(l.details)wrapTxt(l.details,66).forEach(x=>o.push('    '+x));
    const x=[];if(ly.showSerial&&l.serial)x.push('S/N: '+l.serial);
    if(ly.showWarranty&&l.warranty_months)x.push('Warranty: '+wtyText(l.warranty_months)+(ly.showUntil?' (until '+addMonths(inv.inv_date,l.warranty_months)+')':''));
    if(x.length)o.push('    '+x.join('  '));
  });
  o.push(bar,r('Subtotal: '+money(inv.subtotal),W));
  if(+inv.discount)o.push(r('Discount: '+money(inv.discount),W));
  o.push(r('TOTAL Rs.: '+money(inv.total),W));
  if(pi.has){pi.pays.forEach(x=>o.push(r(payLbl(x)+': '+money(x.amount),W)));if(pi.bal>0.005)o.push(r('Balance: '+money(pi.bal),W))}
  o.push(bar);
  const tOv=ov('terms');
  if(tOv!==null){wrapTxt(tOv,W).forEach(x=>o.push(x));o.push(bar)}
  else if(ly.terms){o.push(ly.termsTitle+':');wrapTxt(ly.terms,W).forEach(x=>o.push(x));o.push(bar)}
  o.push(c(ov('footer')!==null?ov('footer'):ly.footer));
  const labels=[ly.sigL,ly.sigM,ly.sigR].filter(Boolean);
  if(full&&ly.showSig&&labels.length){const cw=Math.floor(W/labels.length);o.push('','');o.push(labels.map(()=>p('_'.repeat(cw-4),cw)).join(''));o.push(labels.map(x=>p(x,cw)).join(''))}
  return o.join('\n').replace(/\t/g,'    ');
}

function permModal(id){
  const u=USERS.find(x=>x.id===id);
  openModal(`<h3>Permissions: ${esc(u.username)}</h3>${permBoxes('pm',u.perms||[])}
  <p class="mut">Only admins can use Users, Invoice editor and delete invoices.</p>
  <div class="bar" style="margin-top:10px;justify-content:flex-end"><div style="flex:0"><button class="btn sec" onclick="closeModal()">Cancel</button></div><div style="flex:0"><button class="btn" onclick="savePerm('${id}')">Save</button></div></div>`);

async function savePerm(id){await run(sb.from('profiles').update({perms:permRead('pm')}).eq('id',id));closeModal();toast('Permissions saved');go('users')}
async function addUser(){
  const n=$('#u_n').value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,''),pw=$('#u_p').value,role=$('#u_r').value;
  const em=($('#u_e').value.trim().toLowerCase())||(n+EMAIL_DOMAIN);
  if(!n||pw.length<6)return toast('Username and a password of 6+ characters are required',true);
  if(await emailFor(n))return toast('That username already exists',true);
  const sb2=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  const {data,error}=await sb2.auth.signUp({email:em,password:pw,options:{data:{username:n}}});
  if(error)return toast('Could not create user: '+error.message,true);
  if(!data.user||(data.user.identities&&data.user.identities.length===0))return toast('That email is already registered',true);
  const uid=data.user.id;let done=false;
  for(let k=0;k<12&&!done;k++){
    const {data:pr}=await sb.from('profiles').select('id').eq('id',uid).maybeSingle();
    if(pr){await run(sb.from('profiles').update({role,active:true,perms:permRead('np')}).eq('id',uid));done=true}else await sleep(400);
  }
  if(!done)return toast('User was created in Supabase Auth but has no profile row. Run supabase_update_v2.sql, then approve the user here.',true);
  toast('User created');go('users');
}
async function setRole(id,role){await run(sb.from('profiles').update({role}).eq('id',id));toast('Role updated')}
async function setActive(id,a){await run(sb.from('profiles').update({active:a}).eq('id',id));go('users')}

function repQuick(k){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();let a,b;
  if(k==='today')a=b=n;
  else if(k==='yest'){a=b=new Date(y,m,n.getDate()-1)}
  else if(k==='month'){a=new Date(y,m,1);b=new Date(y,m+1,0)}
  else if(k==='last'){a=new Date(y,m-1,1);b=new Date(y,m,0)}
  else{a=new Date(y,0,1);b=new Date(y,11,31)}
  $('#r_f').value=ymd(a);$('#r_t').value=ymd(b);repRun();
}
function payCols(v){
  const o={cash:0,bank:0,cheque:0,card:0,credit:0},t=Number(v.total)||0;
  if(Array.isArray(v.payments)&&v.payments.length){
    v.payments.forEach(p=>{const a=Number(p.amount)||0,m=String(p.method).toLowerCase();if(m==='cash')o.cash+=a;else if(m.startsWith('bank'))o.bank+=a;else if(m==='cheque')o.cheque+=a;else if(m==='card')o.card+=a});
    o.credit=Math.max(0,t-(o.cash+o.bank+o.cheque+o.card));
  }else{
    const m=String(v.pay_method||'').toLowerCase();
    if(m==='cash')o.cash=t;else if(m.startsWith('bank'))o.bank=t;else if(m==='cheque')o.cheque=t;else if(m==='card')o.card=t;else o.credit=t;
  }
  return o;
}
async function repRun(){
  const from=$('#r_f').value,to=$('#r_t').value,mode=$('#r_m').value;
  if(!from||!to)return;
  $('#r_out').innerHTML='<p class="mut">Loading…</p>';$('#r_buy').innerHTML='';
  const inv=await allRows(()=>sb.from('invoices').select('*').gte('inv_date',from).lte('inv_date',to).order('inv_date').order('id'));
  const its=await allRows(()=>sb.from('invoice_items').select('invoice_id,description,qty,amount,cost,invoices!inner(inv_date)').gte('invoices.inv_date',from).lte('invoices.inv_date',to).order('id'));
  const cost=hasP('cost'),costBy={};
  its.forEach(x=>{costBy[x.invoice_id]=(costBy[x.invoice_id]||0)+Number(x.cost||0)*Number(x.qty)});
  const rows=inv.map(v=>({v,...payCols(v),total:Number(v.total),profit:Number(v.total)-(costBy[v.id]||0)}));
  const z=()=>({n:0,cash:0,bank:0,cheque:0,card:0,credit:0,total:0,profit:0});
  const add=(a,r)=>{a.n++;['cash','bank','cheque','card','credit','total','profit'].forEach(k=>a[k]+=r[k])};
  const all=z();rows.forEach(r=>add(all,r));
  const m=x=>x?money(x):'0.00';
  const head=(first)=>[...first,['Cash',1],['Bank',1],['Cheque',1],['Credit Card',1],['Credit',1],['Total Sales',1],...(cost?[['Total Profit',1]]:[])];
  const cells=r=>[m(r.cash),m(r.bank),m(r.cheque),m(r.card),m(r.credit),money(r.total),...(cost?[money(r.profit)]:[])];
  let h='';
  if(mode==='inv'){
    h=rgrid(head([['Date'],['Inv No'],['Customer'],['Remark']]),rows.map(r=>[r.v.inv_date,esc(r.v.inv_no),esc((r.v.customer_code?r.v.customer_code+' ':'')+(r.v.customer_name||'')),esc(r.v.note),...cells(r)]),['','','','',...cells(all)]);
  }else if(mode==='date'||mode==='month'){
    const g={};rows.forEach(r=>{const k=mode==='date'?r.v.inv_date:r.v.inv_date.slice(0,7);(g[k]=g[k]||z());add(g[k],r)});
    h=rgrid(head([[mode==='date'?'Date':'Month'],['Invoices',1]]),Object.keys(g).sort().map(k=>[k,g[k].n,...cells(g[k])]),['Total',all.n,...cells(all)]);
  }else if(mode==='cust'){
    const g={};rows.forEach(r=>{const k=(r.v.customer_code?r.v.customer_code+' ':'')+(r.v.customer_name||'Walk-in');(g[k]=g[k]||z());add(g[k],r)});
    h=rgrid(head([['Customer'],['Invoices',1]]),Object.keys(g).sort().map(k=>[esc(k),g[k].n,...cells(g[k])]),['Total',all.n,...cells(all)]);
  }else{
    const g={};its.forEach(x=>{const k=x.description||'-';(g[k]=g[k]||{q:0,a:0,c:0});g[k].q+=Number(x.qty);g[k].a+=Number(x.amount);g[k].c+=Number(x.cost||0)*Number(x.qty)});
    const ks=Object.keys(g).sort(),tq=ks.reduce((a,k)=>a+g[k].q,0),ta=ks.reduce((a,k)=>a+g[k].a,0),tc=ks.reduce((a,k)=>a+g[k].c,0);
    h=rgrid([['Item'],['Qty',1],['Amount',1],...(cost?[['Cost',1],['Profit',1]]:[])],ks.map(k=>[esc(k),g[k].q,money(g[k].a),...(cost?[money(g[k].c),money(g[k].a-g[k].c)]:[])]),['Total',tq,money(ta),...(cost?[money(tc),money(ta-tc)]:[])]);
  }
  const sum=`<div class="bar" style="justify-content:flex-end;margin-top:6px"><div style="flex:0 0 150px"><label>No of Inv</label><input readonly value="${all.n}" style="background:#fff7a8;font-weight:700;text-align:right"></div><div style="flex:0 0 190px"><label>Net Sales</label><input readonly value="${money(all.total)}" style="background:#fff7a8;font-weight:700;text-align:right"></div>${cost?`<div style="flex:0 0 190px"><label>Net Profit</label><input readonly value="${money(all.profit)}" style="background:#fff7a8;font-weight:700;text-align:right"></div>`:''}</div>`;
  window._rep={title:'Sales '+from+(from===to?'':' to '+to),html:h,sum:`No of invoices: ${all.n} | Net sales: Rs. ${money(all.total)}${cost?' | Net profit: Rs. '+money(all.profit):''}`};
  $('#r_out').innerHTML=h+sum;
}
function rgrid(h,rows,foot){
  return `<div class="tw"><table><thead><tr>${h.map(x=>`<th class="${x[1]?'r':''}">${x[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${h[i]&&h[i][1]?'r':''}">${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="mut">No sales in this period.</td></tr>`}</tbody><tfoot><tr>${foot.map((c,i)=>`<th class="${h[i]&&h[i][1]?'r':''}" style="background:#fff7a8;color:#a40000">${c}</th>`).join('')}</tr></tfoot></table></div>`;
}
async function repBuy(){
  const from=$('#r_f').value,to=$('#r_t').value;
  const d=await allRows(()=>sb.from('grn').select('*').gte('grn_date',from).lte('grn_date',to).order('grn_date').order('id'));
  const t=d.reduce((a,g)=>a+Number(g.total),0);
  $('#r_buy').innerHTML='<h3 style="margin:14px 0 8px">Purchases (GRN)</h3>'+rgrid([['Date'],['GRN No'],['Supplier'],['Ref'],['Total cost',1]],d.map(g=>[g.grn_date,esc(g.grn_no),esc(g.supplier),esc(g.ref_no),money(g.total)]),['','','','',money(t)]);
  window._rep.html+=$('#r_buy').innerHTML;
}
function repPrint(){if(!window._rep)return;printHtml(window._rep.title,`<h2>${esc(window._rep.title)}</h2><div>${esc(settings.company_name||'')}</div><p><b>${window._rep.sum}</b></p>${window._rep.html}`,'@page{size:A4 landscape;margin:10mm}th,td{font-size:11px}')}
</script>
